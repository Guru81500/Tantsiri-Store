name = "tantsiri-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[kv_namespaces]]
binding = "AUTH_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
ALLOWED_ORIGIN = "https://YOUR-USERNAME.github.io"
GITHUB_OWNER = "YOUR-GITHUB-USERNAME"
GITHUB_REPO = "tantsiri-private-storage"
GITHUB_BRANCH = "main"
GITHUB_APP_ID = "REPLACE_ME"
GITHUB_INSTALLATION_ID = "REPLACE_ME"
RESEND_FROM = "Tantsiri <orders@yourdomain.com>"
ADMIN_EMAILS = "owner@example.com,admin@example.com"
